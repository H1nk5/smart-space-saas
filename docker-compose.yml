services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartspace
      POSTGRES_USER: smartspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - smartspace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartspace -d smartspace"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8080
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+asyncpg://smartspace:${POSTGRES_PASSWORD}@database:5432/smartspace
      CORS_ORIGINS: http://127.0.0.1:8081,http://localhost:8081
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  seed:
    build: ./backend
    profiles: ["seed"]
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+asyncpg://smartspace:${POSTGRES_PASSWORD}@database:5432/smartspace
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD in .env}
    command: ["python", "-m", "scripts.seed_demo"]
    depends_on:
      database:
        condition: service_healthy

volumes:
  smartspace-postgres:
